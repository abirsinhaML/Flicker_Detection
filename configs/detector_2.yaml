s3:
  bucket: prod-egocentric-humyn-data
  # When prefixes is set, all prefixes will be processed in order.
  # Remove or comment out prefixes to use the single prefix field instead.
  # Mark completed prefixes with "# done" or comment them out entirely to skip.
  prefixes:
    - raw/Kalpana_Furnitures_Chennai/
    - raw/Kalpanafurnitures/2026-07-18/
    - raw/KPM/


  # Single prefix (used only if prefixes is not set or empty)
  prefix: raw/2026-05-16/mirana_test/
  # Must match the bucket's region: SigV4 presigning is region-scoped, and a
  # mismatch yields URLs that fail with 403 rather than a clear error.
  region: ap-south-1
  # profile: null            # optional named profile; omit to use the standard chain
  extensions: [".mp4"]
  # Long enough for one video's windowed decode, short enough that a leaked URL
  # ages out quickly. Signed per video inside the worker, never persisted.
  presign_expiry_seconds: 3600

sampling:
  window_duration: 3.0
  stride: 20.0
  overlap: 0.0
  min_window_duration: 2.0
  mode: uniform
  resize: [320, 180]

# How frames are turned back into pixels. Decoding is this pipeline's entire
# cost: the analysed signal is 320x180, but the sources are 3840x2880 at 29.97
# fps, so libavcodec spends far more CPU reconstructing frames than the
# detectors spend measuring them. On one 3s window of 4K H.264, software decode
# costs 1.65 s of CPU against 0.33 s for NVDEC.
decode:
  # auto = NVDEC when the driver, codec, and resolution allow, software
  # otherwise. cuda = insist on NVDEC (still falls back unless allow_fallback
  # is false). cpu = the previous behaviour.
  backend: auto
  gpu_index: 0
  # Software-path frame threading; 0 lets FFmpeg pick. PyAV leaves threading
  # off by default, which is worth 22s -> 8s per 30s of 4K.
  threads: 0
  # Hardware decode is an optimisation, never a requirement: an unsupported
  # profile or an exhausted GPU must slow the batch down, not drop videos from
  # it. Set false only to prove the hardware path is actually being taken.
  allow_fallback: true
  # Where the 3840x2880 -> 320x180 downscale happens.
  #
  #   false -> NVDEC decodes, swscale downscales. Only the decode changes, and
  #            NVDEC implements the same normative H.264 reconstruction. Across
  #            24 real corpus videos the worst flicker_score difference was
  #            0.00055 and no video changed severity band or route.
  #   true  -> NVDEC downscales too, so full-res frames never cross PCIe, and
  #            per-window CPU drops further. NOT SAFE at the current thresholds:
  #            of the first three corpus videos tried, one moved 0.352 -> 0.310,
  #            crossing mild_threshold and changing review -> accept. That is a
  #            flickering video passing unseen. Enabling it means re-fitting
  #            `decision` against GPU-decoded scores.
  #
  # Check any change with scripts/compare_decode_backends.py before a batch.
  gpu_resize: false

# NOTE ON WORKER COUNT: with NVDEC the bottleneck stops being CPU cores and
# becomes the GPU's decode engines, its memory, and S3 egress. Each worker
# holds its own CUDA context (a few hundred MB of VRAM), so --workers 32 that
# made sense for software decode will exhaust a 23 GB card long before it
# saturates it. Start near the number of NVDEC engines times two and measure.

detector_version: "0.2.0"

# Which pixels a window's signals are measured over. This corpus is fisheye:
# a 960x720 image circle pillarboxed inside a 1280x720 frame, so 25% of every
# frame is matte black. Averaging over it scales absolute measurements by the
# crop fraction and ties the calibration to one camera's geometry.
analysis_region:
  # Luma at or below this level is treated as matte border, judged on each
  # pixel's maximum over the window so a dim scene is not mistaken for a crop.
  border_threshold: 8.0
  # With a ~180 degree egocentric field of view the lowest rows are the wearer's
  # own torso and hands: differently lit, self-shadowed, and moving with the
  # camera without parallax. Measured band contrast there is ~2.7x weaker than
  # mid-frame. Provisional, and worth fitting alongside the other scales.
  exclude_bottom_fraction: 0.25
  # Guard: if a policy would discard this much of the frame, measure it all and
  # warn instead of reporting a signal built from a handful of pixels.
  min_valid_fraction: 0.2

# Which spectral peak counts as "the" flicker component.
#
# Peak selection used to be unbounded, and over a window long enough to resolve
# the flicker band, egocentric head motion and exposure drift deposit far more
# energy below 2 Hz than the flicker carries. On the reference video the chosen
# peak was 0.67 Hz of head motion while the real flicker sat at 9.99 Hz, so every
# frequency measurement described the wrong phenomenon.
#
# 9.99 Hz is what theory predicts: 50 Hz Indian mains gives 100 Hz full-wave
# illuminant flicker, which at 29.97 fps aliases to |100 - 3*29.97| = 10.09 Hz.
#
# CAUTION: this floor is region-specific. At 60 Hz mains, 120 Hz flicker aliases
# to |120 - 4*29.97| = 0.12 Hz and would fall *below* this floor. Revisit before
# running on 60 Hz footage.
flicker_band:
  min_frequency: 2.0
  max_frequency: null      # null = Nyquist

illuminant_detector:
  enabled: true

rolling_band_detector:
  enabled: true
  smoothing_sigma: 2.0

awb_detector:
  enabled: true
  # Mechanism boundary, not a severity threshold: AE controllers hunt at a few
  # hertz, while the mains beat above this belongs to the illuminant detector.
  # The lower bound trims the slowest drift; note that genuine AE hunting and
  # egocentric head motion genuinely overlap inside this band.
  ae_min_frequency: 0.5
  ae_max_frequency: 5.0

# Normalization scales convert raw detector measurements into bounded evidence.
# Each reference is the measurement that scores 0.5, so it reads as "what I
# consider borderline". These are provisional starting points carried over from
# the previous boolean thresholds and are the values to fit against the
# reference labels; nothing downstream hardcodes a magic number.
aggregation:
  positive_threshold: 0.5
  weights:
    IlluminantDetector: 0.10
    RollingBandDetector: 0.65
    AWBDetector: 0.25
  illuminant_normalization:
    prominence_reference: 4.0
    periodicity_reference: 8.0
    # Relative luminance swing, as a fraction of scene level. Spectral shape is
    # measured after standardization and so is amplitude-blind; this is the axis
    # that actually distinguishes an invisible ripple from visible flicker.
    # 2% is around where flicker becomes perceptible.
    modulation_depth_reference: 0.02
  awb_normalization:
    chroma_prominence_reference: 2.0
    chroma_periodicity_reference: 4.0
    chroma_variance_reference: 0.5
    ae_prominence_reference: 2.0
    ae_periodicity_reference: 4.0
    ae_modulation_depth_reference: 0.02
  rolling_band_normalization:
    # The band's swing as a fraction of scene level, matching the illuminant
    # detector's modulation-depth scale. The other two factors of this
    # detector's score (phase linearity, horizontal coherence) are
    # correlation-like and already bounded, so this is its only fitted scale.
    band_amplitude_reference: 0.02

decision:
  # Set against the 25 colour-coded reference videos (see reports/).
  #
  # The clean/mild boundary sits in a genuine gap: no reference video scores
  # between 0.3195 (highest clean) and 0.3365 (lowest mild), so the midpoint is
  # the most defensible point and separates those two classes perfectly.
  mild_threshold: 0.365
  # Placed just above 004_976 (0.5046), which reviewing the footage directly
  # judged mild despite the reference sheet's orange-vs-red ambiguity. This
  # deliberately disagrees with the sheet on four videos it marks extreme
  # (973, 991, 996, 972 at 0.4666-0.4975), which now route to `review` instead
  # of `reject`. That is the safe direction for a QC gate: a human still sees
  # them, whereas an over-called reject is acted on unseen. Worth revisiting
  # once the larger hand-labelled set exists.
  extreme_threshold: 0.59
