version: 1
disable_existing_loggers: false

formatters:
  standard:
    # The batch runs one process per worker, and every one of them logs to the
    # same stream.  Without the pid, consecutive lines read as one video's
    # sequence when they belong to different videos entirely.
    format: "%(asctime)s | pid=%(process)d | %(levelname)s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stderr
  file:
    class: logging.FileHandler
    level: INFO
    formatter: standard
    filename: output/detector.log
    mode: a

root:
  level: INFO
  handlers: [console, file]
